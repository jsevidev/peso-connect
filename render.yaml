databases:
  - name: peso-connect-db
    plan: free
    databaseName: peso_connect
    user: peso_connect

services:
  - type: web
    name: peso-connect
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: PESO Connect
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://peso-connect.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: peso-connect-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log
      - key: PESO_ADMIN_EMAIL
        value: admin@peso.local
